# ──────────────────────────────────────────────────────────
# CI - Continuous Integration
#
# Runs on every push and pull request.
# Four jobs: lint + type-check (parallel) → test → build
# ──────────────────────────────────────────────────────────

name: CI

# ── TRIGGERS ─────────────────────────────────────────────
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  PYTHON_VERSION: "3.12"

jobs:

  # ╔══════════════════════════════════════════════════════╗
  # ║  JOB 1: LINT (PEP 8 strict)                        ║
  # ║                                                      ║
  # ║  Ruff enforces PEP 8 style, naming conventions,    ║
  # ║  import ordering, docstrings, type annotation       ║
  # ║  presence, security checks, and more.               ║
  # ║                                                      ║
  # ║  Rules are defined in pyproject.toml [tool.ruff].   ║
  # ╚══════════════════════════════════════════════════════╝
  lint:
    name: Lint (PEP 8 + ruff)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - run: uv sync --all-extras
        working-directory: backend

      # ruff check: runs ALL selected lint rules from pyproject.toml
      # --output-format=github: annotates errors inline on the PR diff
      - name: Ruff lint (PEP 8 + docstrings + annotations + security)
        run: uv run ruff check src/ tests/ --output-format=github
        working-directory: backend

      # ruff format --check: ensures all files match the canonical style
      # (tabs vs spaces, trailing whitespace, blank lines, etc.)
      - name: Ruff format check
        run: uv run ruff format --check src/ tests/
        working-directory: backend

  # ╔══════════════════════════════════════════════════════╗
  # ║  JOB 2: TYPE CHECK (mypy strict)                    ║
  # ║                                                      ║
  # ║  mypy --strict enforces:                             ║
  # ║    - Type annotations on ALL function signatures    ║
  # ║    - No implicit Any                                 ║
  # ║    - No untyped function definitions                ║
  # ║    - Correct return types                            ║
  # ║    - Proper Optional handling (no implicit None)    ║
  # ║                                                      ║
  # ║  This runs in PARALLEL with lint (no "needs:")      ║
  # ║  because they're independent checks.                ║
  # ╚══════════════════════════════════════════════════════╝
  type-check:
    name: Type check (mypy strict)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - run: uv sync --all-extras
        working-directory: backend

      # mypy reads its config from pyproject.toml [tool.mypy]
      # strict = true enables all strictness flags at once
      - name: mypy
        run: uv run mypy src/
        working-directory: backend
        env:
          SUPABASE_URL: http://localhost:54321
          SUPABASE_ANON_KEY: dummy
          SUPABASE_SERVICE_ROLE_KEY: dummy
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/test

  # ╔══════════════════════════════════════════════════════╗
  # ║  JOB 3: TEST (pytest + 80% coverage gate)           ║
  # ║                                                      ║
  # ║  Waits for BOTH lint and type-check to pass.        ║
  # ║                                                      ║
  # ║  pytest-cov measures how much of your source code   ║
  # ║  is exercised by tests. --cov-fail-under=80 means   ║
  # ║  the CI FAILS if coverage drops below 80%.          ║
  # ║                                                      ║
  # ║  The coverage.report.exclude_lines config in        ║
  # ║  pyproject.toml excludes NotImplementedError stubs  ║
  # ║  and abstract methods from the count, so skeleton   ║
  # ║  code doesn't artificially deflate the number.      ║
  # ╚══════════════════════════════════════════════════════╝
  test:
    name: Test (pytest, coverage >= 80%)
    runs-on: ubuntu-latest
    needs: [lint, type-check]

    strategy:
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - run: uv sync --all-extras --python ${{ matrix.python-version }}
        working-directory: backend

      # pytest reads addopts from pyproject.toml which includes:
      #   --cov=app               → measure coverage of the app package
      #   --cov-report=term-missing → show which lines are NOT covered
      #   --cov-fail-under=80     → EXIT CODE 1 if coverage < 80%
      - name: Run tests with coverage
        run: uv run pytest -v --tb=short
        working-directory: backend
        env:
          SUPABASE_URL: http://localhost:54321
          SUPABASE_ANON_KEY: dummy-anon-key
          SUPABASE_SERVICE_ROLE_KEY: dummy-service-key
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/test

  # ╔══════════════════════════════════════════════════════╗
  # ║  JOB 4: BUILD                                       ║
  # ║  Confirms the package can be built into a wheel.    ║
  # ╚══════════════════════════════════════════════════════╝
  build:
    name: Build check
    runs-on: ubuntu-latest
    needs: [lint, type-check]

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - run: uv sync --all-extras
        working-directory: backend

      - name: Build wheel
        run: uv build
        working-directory: backend
