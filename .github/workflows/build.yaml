name: Build
on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
jobs:
  sonarcloud:
    name: SonarCloud
    runs-on: ubuntu-latest # Docker-based scanner — must be Linux
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full history needed for blame/relevancy data
      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master # SonarCloud, not SonarQube
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # PR decoration & status checks
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }} # Add this secret in GitHub repo settings
