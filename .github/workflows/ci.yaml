name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"
  # Supabase test configuration (local test values)
  SUPABASE_URL: http://localhost:54321
  SUPABASE_PUBLISHABLE_KEY: sb_publishable_test  # pragma: allowlist secret
  SUPABASE_SECRET_KEY: sb_secret_test  # pragma: allowlist secret
  DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:54322/test
  MIGRATION_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:54322/test

jobs:
  # Fast feedback - lint + type-check in parallel
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --group dev
        working-directory: backend
      - run: uv run ruff check src/ tests/ --output-format=github
        working-directory: backend
      - run: uv run ruff format --check src/ tests/
        working-directory: backend

  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --group dev
        working-directory: backend
      - run: uv run mypy src/
        working-directory: backend

  # Tests (no DB needed until database layer is implemented)
  test:
    name: Test
    runs-on: ubuntu-latest
    needs: [lint, type-check]

    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --group dev
        working-directory: backend

      # TODO: re-add postgres service + alembic upgrade head once DB layer is set up
      - run: uv run pytest -xvs --tb=short
        working-directory: backend

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, type-check] # Don't wait for tests
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --group dev
        working-directory: backend
      - run: uv build
        working-directory: backend

  # Frontend — lint, typecheck, and build the React SPA.
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
