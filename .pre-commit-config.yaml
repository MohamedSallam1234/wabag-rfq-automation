# .pre-commit-config.yaml
default_install_hook_types: [pre-commit, commit-msg]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-merge-conflict
        stages: [pre-commit]
      - id: check-added-large-files
        args: [--maxkb=1000]
        stages: [pre-commit]
      - id: trailing-whitespace
        stages: [pre-commit]
      - id: end-of-file-fixer
        stages: [pre-commit]

  - repo: local
    hooks:
      - id: branch-name
        name: branch check
        entry: bash scripts/check-branch-name.sh
        language: system
        always_run: true
        pass_filenames: false
        stages: [pre-commit]

      - id: test
        name: test
        entry: bash -c 'cd backend && uv run pytest src/ tests/'
        language: system
        always_run: true
        pass_filenames: false
        stages: [pre-commit]

      - id: ruff-format
        name: ruff format
        entry: bash -c 'cd backend && uv run ruff format src/ tests/'
        language: system
        always_run: true
        pass_filenames: false
        stages: [pre-commit]

      - id: ruff-lint
        name: ruff lint
        entry: bash -c 'cd backend && uv run ruff check src/ tests/'
        language: system
        always_run: true
        pass_filenames: false
        stages: [pre-commit]

      - id: mypy
        name: mypy type check
        entry: bash -c 'cd backend && uv run mypy src/'
        language: system
        always_run: true
        pass_filenames: false
        stages: [pre-commit]

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.0.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args:
          [
            feat,
            fix,
            hotfix,
            docs,
            style,
            refactor,
            perf,
            test,
            build,
            ci,
            cd,
            chore,
            revert,
          ]
