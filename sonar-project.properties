# =============================================================
# SonarCloud / SonarQube Project Configuration
# =============================================================
# Docs: https://docs.sonarcloud.io/advanced-setup/analysis-parameters/
# =============================================================

# --- Project Identity ---
sonar.projectKey=MohamedSallam1234_wabag-rfq-automation
sonar.organization=mohamedsallam1234
sonar.projectName=WABAG RFQ Automation
sonar.projectVersion=0.1.0

# --- Sources & Language ---
sonar.sources=backend/src
sonar.tests=backend/tests
sonar.python.version=3.12

# --- Coverage Report ---
# Generated by pytest-cov; path is relative to project root
sonar.python.coverage.reportPaths=backend/coverage.xml

# --- Exclusions ---
sonar.exclusions=\
  backend/.venv/**,\
  backend/alembic/versions/**,\
  backend/**/__pycache__/**,\
  **/*.pyc,\
  **/migrations/**

sonar.coverage.exclusions=\
  backend/tests/**,\
  backend/src/app/main.py,\
  backend/alembic/**
